<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoom Workplace — PWA shell (harness)</title>
    <!-- Replicates app.zoom.us: the shell repeats the waiting text in its
         meeting card while the real lobby renders in a "webclient" iframe.
         Used to verify the one-cat dedup rule; no harness cat here. -->
    <style>
      * { margin: 0; box-sizing: border-box; }
      body {
        display: flex;
        min-height: 100vh;
        background: #fff;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      aside {
        width: 320px;
        border-right: 1px solid #e7e7ea;
        padding: 18px;
      }
      .card { border: 1px solid #e7e7ea; border-radius: 10px; padding: 14px; }
      .card h2 { font-size: 15px; margin-bottom: 6px; }
      .card .when { font-size: 12px; color: #6c6c70; margin-bottom: 10px; }
      .card .status { font-size: 13px; color: #222; }
      iframe { flex: 1; border: 0; height: 100vh; }
    </style>
  </head>
  <body>
    <aside>
      <div class="card">
        <h2>Shell's Zoom Meeting</h2>
        <div class="when">Scheduled: 7:00 PM</div>
        <div class="status">The host will admit you when they're ready</div>
      </div>
    </aside>
    <iframe name="webclient" src="/lobbies/zoom-waiting.html"></iframe>
  </body>
</html>
